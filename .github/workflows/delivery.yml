name: Validación y publicación
on:
  push:
    branches: [main, novaauto-store]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:checkout
      - run: npm run build
      - run: npm run build
        env:
          VITE_STATIC_PREVIEW: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/novaauto-store'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
